# Website timeline spec: which master entries/bullets the homepage shows,
# plus web-only display overrides (condensed org names, work type).
# Rendered at site build time by src/_data/resume.js.
#
# `links:` on an entry renders one link line under its bullets — a label, then
# the links separated by middots — with the same formatter the publications
# use for their Paper / write-up line, so every timeline card links the same way.
education:
  - id: ucsd-ms
    school: UC San Diego
    degree: Master's degree
  - id: ucsd-bs
    school: UC San Diego
    degree: Bachelor's degree

experience:
  - id: aquamesh
    workType: Hybrid
    bullets: [web-summary]
    links:
      label: Projects
      items:
        - { label: AquaSpectra, href: /projects/aquaspectra/ }
  - id: arclab
    org: UCSD Advanced Robotics and Controls Lab
    workType: Hybrid
    bullets: [web-summary]
    links:
      label: Projects
      items:
        - { label: Endoscopic Navigation, href: /projects/endoscopic-navigation/ }
  - id: resmed
    workType: Hybrid
    bullets: [web-summary]
  - id: e4e
    workType: Hybrid
    bullets: [lead]
    links:
      label: Projects
      items:
        - { label: Radio Telemetry Tracker, href: /projects/radio-telemetry-tracker/ }
        - { label: Baboons on the Move, href: /projects/baboons-on-the-move/ }
  - id: leidos
    bullets: [doj-monitoring, rca-automation]
  - id: ta
    workType: Hybrid
    bullets: [merged]
  - id: cubic
    workType: Hybrid
    bullets: [doors-traceability, clipper-sql]

# Every publication in master.yaml is shown; this only adds the link to the
# project write-up each paper came out of.
publications:
  - id: chaser
    project: /projects/followme-robot/

volunteering:
  - id: triton-tails
    org: Triton Tails
    bullets: [web-summary]
