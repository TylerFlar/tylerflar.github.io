# Web-only touches for the homepage, which shows what the CV shows: the
# entries cv.yaml picks, in the CV's order and under its section titles
# (src/_data/resume.js -> _resumes/_lib/render-web.js). Each entry gets one line
# there, its website summary (the bullet marked alt) or else its first CV
# bullet, and a role links its subprojects on the CV that have pages. This file
# only adds what's web-only, by entry id, and an id that isn't on the CV fails
# the build.
education:
  ucsd-ms: { school: UC San Diego }
  ucsd-bs: { school: UC San Diego }

experience:
  arclab: { workType: Hybrid }
  resmed: { workType: Hybrid }
  e4e: { workType: Hybrid }
  cubic: { workType: Hybrid }

# The write-up page a paper came out of.
publications:
  chaser: { project: /projects/followme-robot/ }
