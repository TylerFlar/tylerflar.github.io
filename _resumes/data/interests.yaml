# Interests — the little "what I'm into" row: emoji bubbles in the homepage hero,
# and a centered text line near the top of the CV, under the summary.
#
# Two parts, deliberately separated:
#
#   selected:  the interests that actually show, in display order. This is the
#              only part that changes often — a Tasque "interests sync" run
#              rewrites it from what he's actually been doing and talking about.
#   bank:      the fixed vocabulary you may pick from. Modelled on dating-app
#              interest badges (Bumble ships ~200 badges across a dozen
#              categories, Tinder "Passions" 3-5 per profile, Hinge interests) —
#              broad, instantly readable labels that a stranger understands at a
#              glance. That generality is the point: "Cooking", not "sous-vide
#              short ribs"; "Video games", not one game's name.
#
# An id in `selected` that isn't in `bank` is a build error, which is what keeps
# the row from drifting into hyper-specific one-offs. Need something the bank
# genuinely lacks? Add it to the bank first, as a label that would look at home
# next to the ones already there.
#
# `label` is rendered on the CV through the LaTeX escaper, so it must be plain
# ASCII prose. `emoji` is website-only — the CV is text.

# ---------------------------------------------------------------------------
# What shows. Aim for 6-8; the loader refuses more than 10.
# ---------------------------------------------------------------------------
selected:
  - pickleball
  - cooking
  - gym
  - drawing
  - 3d-modeling
  - video-games
  - farmers-markets

# ---------------------------------------------------------------------------
# The bank. Categories exist to keep the vocabulary browsable and balanced —
# they are not shown anywhere.
# ---------------------------------------------------------------------------
