bio: >-
  I'm finishing my CS master's at UC San Diego in March 2027 and looking for a
  software engineering job in San Diego or remote. In summer 2026 I was a
  technical product manager intern at Brightree, where I built a docs-as-code
  pipeline for its API guides and analyzed 553M production API requests. I've
  also interned at Leidos and Cubic. At UCSD I'm building navigation software for
  a robotic endoscope in the Advanced Robotics and Controls Lab, and before that
  I led drone wildlife-tracking projects at Engineers for Exploration. On the
  side I maintain Jackdaw, an open-source Balatro simulator for reinforcement
  learning.

projectsIntro: >-
