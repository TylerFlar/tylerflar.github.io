# The about-me text: the parts of the public face that aren't on the CV.
# Every field is shown verbatim, so what's written here is what people read:
#
#   bio               the homepage hero paragraph; LinkedIn's About is this
#                     plus a pointer to tylerflar.com
#   research          the homepage Research section, one paragraph per line
#   projectsIntro     the paragraph at the top of /projects/
#   linkedinHeadline  LinkedIn's headline, 220 characters at most
#   githubBio         the GitHub profile bio, 160 characters at most
#   news              optional dated one-liners on the homepage, newest first:
#                     { id, date: "YYYY-MM", text }
#
# The schema is closed: an unknown key fails the build. Text uses the same
# markup as master.yaml (**bold**, *italic*, [text](url)).

bio: >-
  I'm a CS master's student at UC San Diego working on autonomous systems. At
  the Advanced Robotics and Controls Lab I'm building navigation for a robotic
  endoscope, and with AquaMesh and Scripps I'm getting an ocean sensor ready for
  research. Before that I led drone wildlife-tracking projects at Engineers for
  Exploration and worked on a human-following Spot robot that became an AIM 2026
  paper. I've also done product and systems work at Brightree, Leidos and Cubic.

research: >-
  A lot of my work has been in places where the usual tools fall short. Inside
  the kidney, visual SLAM loses track on wet, featureless tissue, so our
  endoscope navigates on a map of the kidney built from the patient's CT. In the
  field, radio links drop packets, so the drone software I wrote has every
  command confirmed before the ground station moves on.

projectsIntro: >-
  Research comes first, then software and experiments. When a project was a
  team's, the page tells the whole story and says which part was mine.

linkedinHeadline: >-
  Autonomous systems and robotics · CS master's student at UC San Diego ·
  Research, software and product work

githubBio: >-
  CS master's student at UC San Diego working on autonomous systems and
  robotics.

