bio: >-
  I'm a CS master's student at UC San Diego working on autonomous systems. At
  the Advanced Robotics and Controls Lab I'm building navigation for a robotic
  endoscope, and with AquaMesh and Scripps I'm getting an ocean sensor ready for
  research. Before that I led drone wildlife-tracking projects at Engineers for
  Exploration and worked on a human-following Spot robot that became an AIM 2026
  paper. I've also done product and systems work at Brightree, Leidos and Cubic.

projectsIntro: >-
  Research comes first, then software and experiments. When a project was a
  team's, the page tells the whole story and says which part was mine.

linkedinHeadline: >-
  Autonomous systems and robotics · CS master's student at UC San Diego ·
  Research, software and product work

githubBio: >-
  CS master's student at UC San Diego working on autonomous systems and
