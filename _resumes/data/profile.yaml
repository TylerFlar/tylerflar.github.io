# The about-me text: the parts of the public face that aren't on the CV.
# Every field is shown verbatim, so what's written here is what people read:
#
#   bio               the homepage hero paragraph; LinkedIn's About is this
#                     plus a pointer to tylerflar.com
#   projectsIntro     the paragraph at the top of /projects/
#   linkedinHeadline  LinkedIn's headline, 220 characters at most
#   githubBio         the GitHub profile bio, 160 characters at most
#
# Each one leads with the work, current work first, names no role or job to
# get, and gives the degree last, as a date.
#
# The schema is closed: an unknown key fails the build. Text uses the same
# markup as master.yaml (**bold**, *italic*, [text](url)).

bio: >-
  At UC San Diego I'm working on autonomous navigation for a robotic endoscope
  in the Advanced Robotics and Controls Lab. In summer 2026 I was a technical
  product manager intern at Brightree, where I built a docs-as-code pipeline for
  its API guides and analyzed 553M production API requests. In 2025 I interned
  at Leidos, where I led a DOJ program's monitoring overhaul and got a return
  offer, and in 2023 I interned at Cubic. Given a task or a pointer to where
  things live, I take it from there. Before the lab I led drone wildlife-tracking
  projects at Engineers for Exploration. On the side I run Lycanworks, a
  one-person studio that sells avatar bases for VRChat, and maintain Jackdaw, an
  open-source Balatro simulator for reinforcement learning, and its hosted
  leaderboard. I finish my CS master's at UC San Diego in March 2027.

projectsIntro: >-
  Research comes first, then software and experiments, then class projects.
  When a project was a team's, the page tells the whole story and says which
  part was mine.

linkedinHeadline: >-
  Robotic endoscope navigation at UC San Diego · Brightree, Leidos and Cubic
