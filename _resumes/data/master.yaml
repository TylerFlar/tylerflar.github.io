roles:
  - id: arclab
    org: UC San Diego Advanced Robotics and Controls Lab
    title: Graduate Student Researcher
    location: La Jolla, CA
    start: "2025-09"
    end: present
    bullets:
      - id: surgical-research
        text: >-
          Conducting research in autonomous surgical robotics in collaboration with a
          medical robotics company and physicians at UCSD Health, focused on enabling
          autonomous endoscopic navigation of complex organ structures.
      - id: web-summary
        alt: true
        text: >-
          Developing an autonomous navigation system for flexible ureteroscopy that
          uses pre-operative CT to extract the kidney's graph topology and guides a
          monocular robotic endoscope via graph-based localization and depth-based
          junction detection.
    subprojects:
      - id: endonav
        name: Endoscopic Navigation
        start: "2025-09"
        end: present
        bullets:
          - id: approach
            text: >-
              Building an autonomous flexible-ureteroscopy navigation system that uses
              pre-operative CT to extract the kidney's graph topology
              (calyces/infundibula) and localizes via graph-level reasoning rather than
              dense SLAM—after finding featureless, wet mucosal tissue defeats
              foundational visual SLAM (DROID-SLAM, VGGT-SLAM).
          - id: exploration
            text: >-
              Built a reactive exploration pipeline on real phantom endoscope footage:
              monocular depth (Depth Anything v2), depth-gated junction detection to
              count branch openings, and DINOv2/AnyLoc place recognition feeding a
              topological state machine.
          - id: simulator
            text: >-
              Built a procedural renal collecting-system generator (Python/NumPy) that
              emits a visual lumen mesh, collision proxy, SDF grid, centerline graph,
              waypoints, and stones for a real-time Unity/Gym simulator—superseding an
              earlier all-Python simulator with honest ureteroscope dynamics and
              EndoPBR-style endoscope rendering.
          - id: agent
            text: >-
              Developing an autonomous agent that depth-first explores every calyx,
              laser-fragments and baskets stones, and verifies each calyx is stone-free
              using only the camera frame and noisy proprioception.

