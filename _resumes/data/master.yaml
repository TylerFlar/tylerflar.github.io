        bullets:
          - id: baselines
            text: >-
              Built and benchmarked aerial-video baselines for detecting small
              wildlife in drone footage, including labeling coordination and quality
              checks for the Laikipia Baboon Aerial Dataset.
          - id: agmm
            text: >-
              Implemented an adaptive multi-Gaussian background subtractor in
              C++/OpenCV with first-N-frame initialization, bounded-variance updates,
              and shadow suppression; added a CLI for step-through debugging and
              batch video export.
          - id: mmb
            text: >-
              Recreated a published MATLAB motion-detection pipeline that combines
              multi-frame differencing with low-rank background modeling
              (nuclear-norm optimization); fused motion masks, applied morphology
              cleanup, and tracked detections across frames with temporal consistency
              and interpolation.
          - id: hyperparam
            text: >-
