          edges as possible, seeding from Weisfeiler-Lehman color refinement and
          extending through mapped neighbors.
      - id: refine
        text: >-
          Improved the match with a swap search that rechecks only the edges a swap
          touches and Hungarian reassignment in small color classes, scoring 3.95
          (about 96%) on the course's test instance.

