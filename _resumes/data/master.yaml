    bullets:
      - id: docs-toolchain
        text: >-
          Built a docs-as-code toolchain for Brightree's customer-facing API reference
          guides: 27 guides across 26 external services (606 operations, 911 data
          contracts) authored as schema-validated YAML plus Markdown and rendered to
          branded PDF, Word, and HTML by a Node CLI over Pandoc and Typst, replacing
          hand-edited Word documents; handed off into Brightree's GitHub organization
          with a recorded walkthrough.
      - id: source-truth
        text: >-
          Grounded every contract in the Brightree source rather than the WSDL—tracing
          required-ness, validation rules, and enum values through the VB.NET service
          and data layers—and fixed the drift that surfaced, including fabricated enum
          values, wrong wire types, and 23 search operations that fail when an optional
          sort element is omitted.
      - id: release-sync
        text: >-
          Wrote the release-update workflow: a coding-agent prompt that diffs the guides
          against a new Brightree source checkout and proposes reviewable changes,
          flagging anything it cannot verify instead of inventing it; used it to
          reconcile every guide against the 26.08 and 26.10 releases.
      - id: usage-analysis
        text: >-
          Analyzed 553M production API requests from 3,446 customer sites over 24 days
          with read-only SQL against the raw event log and its hourly rollup,
          reconciling the two to within two requests and recovering the 7.1% of traffic
          (39.5M requests) the rollup silently dropped; findings included 74 order reads
          per order created and half of all polling returning no work.
      - id: deprecation-plan
        text: >-
          Distilled the analysis into a SOAP deprecation plan of eight ranked actions,
          showing that 87% of the 3,265-site upgrade backlog belongs to third-party
          integrators rather than customers, that one Brightree-owned client blocks 863
          sites, and that four services with no customer traffic in 20+ months can be
          retired outright.
      - id: sql-mcp
        text: >-
          Built a read-only SQL Server MCP server (Node) so AI assistants can make
          bounded production lookups: a verifier that sanitizes SQL and rejects anything
          but a single-table, row-capped SELECT under NOLOCK, forced READ UNCOMMITTED,
          per-query cost governors, a circuit breaker, and default-off activation.
      - id: web-summary
        alt: true
        text: >-
          Built the docs-as-code toolchain behind Brightree's 27 customer-facing API
          reference guides, then analyzed 553M production API requests to write the
          usage report and SOAP deprecation plan behind Brightree's API modernization.

