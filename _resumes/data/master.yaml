# Papers I'm an author on. Authors are canonical text so my name can be bolded,
# and the bold is how the budget reads my place among them. `note` says which
# part of the work was mine. `skills` are the ones my part of the paper's work
# used. A paper backs them like any entry, with a budget of its own, by my place
# among its authors: a year's full-time work as first author, and a year over
# the place after that, from the month it came out. So they print for as long
# as the paper does, after the project behind it has aged out.
publications:
  - id: chaser
    title: "CHASER: Robust Human Following on a Legged Robot Using Vision and Bluetooth"
    skills: [C/C++, Python, ROS, MQTT, BLE angle-of-arrival]
    authors: >-
      Julian Raheema, Connor Gag, **Tyler Flar**, Helena Bender, Matthew Zheng,
      Kurt Talke, Ryan Kastner, and Henrik I. Christensen
    venue: 2026 IEEE/ASME International Conference on Advanced Intelligent Mechatronics (AIM)
    location: Genova, Italy
    date: "2026-07"
    url: https://hichristensen.com/publication/2026-chaser/
    urlLabel: Paper
    note: >-
      Contribution: the Bluetooth angle-of-arrival module, which turns BLE readings from
      a Silicon Labs antenna array into a heading back to the operator when the camera
      loses them, cutting tracking interruptions by 70%.
    notes:
      - >-
        On Spot, the combined system cut tracking interruptions by 70% compared with
        vision alone.
      - >-
        Presented at AIM 2026 in Genova, Italy, July 7 to 10, 2026.
      - >-
        The module's receiver was a Silicon Labs BG22 dual-polarized antenna array
        kit, a 4×4 array.

