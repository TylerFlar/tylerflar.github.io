    tagline: Bluetooth direction-finding for Boston Dynamics Spot
    start: "2025-04"
    end: "2025-06"
    bullets:
      - id: aoa
        text: >-
          Built a Bluetooth direction-finding “follow-me” stack for Boston Dynamics
