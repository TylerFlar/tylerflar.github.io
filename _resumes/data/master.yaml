        notes:
          - >-
            I led RTT for a little over a year, after reviving it from a dormant state.
            The parts I built are the new payload hardware, the field-device software,
            the drone-to-ground link and the ground station. The DSP library (the ping
            detector and localizer), the drone casing and the tower power work were
            other students' and staff's.
          - >-
            The payload parts I picked were an UP 7000 computer (Intel N100, 8 GB RAM,
            64 GB eMMC), a SparkFun NEO-M9N GPS and compass, a USRP B200mini-i
            software-defined radio (SDR), a Nooelec LaNA amplifier and a SiK V3
            telemetry radio. I picked x86 because signal-processing tools are better
            supported there than on ARM. The SiK radio needed an aluminum enclosure to
            shield it from the computer and the SDR.
          - >-
            The drone was a DJI Matrice 350 RTK, so the payload drew power through
            DJI's SkyPort.
          - >-
            The field-device software reads GPS and heading, runs the lab's ping
            detector on the SDR stream, matches each ping to the nearest GPS sample,
            and keeps the raw pings and a running location estimate per tag frequency.
            It configures the detector's pulse width, SNR threshold, target
            frequencies, gain, sample rate and center frequency.
          - >-
            The payload computer runs unattended during a flight, with no keyboard or
            monitor: it starts on boot, writes detailed logs to local storage, and
            shows the operator only whether it's healthy. Pings and estimates go to CSV
            files with run IDs and timestamps.
          - >-
            The GPS filter rejects any fix that jumps more than 1,000 m from the last
            valid one or climbs faster than 100 m a second.
          - >-
            The drone-to-ground link has two kinds of acknowledgment: the transport
            confirms a packet arrived, and the application confirms the action
            finished. The ground station changes state only when the drone answers a
            StartRequest with StartResponse(success=true).
          - >-
            Each packet is a Protobuf message in a binary frame: a sync marker, a
            big-endian length, the payload and a CRC-CCITT checksum. The transport
            keeps a queue of packets waiting for an ack and resends them on a timeout,
            up to a retry limit.
          - >-
            The comms package has serial and simulated-TCP radio interfaces, so the
            whole stack runs with no hardware attached.
          - >-
            The ground station sets scan parameters (gain, sample rate, target
            frequencies), starts and stops missions, and shows the drone's track, pings
            and estimates on a map. It's a PyQt6 desktop app around a React and Leaflet
            map, works with no internet on map tiles cached in SQLite, and a release
            workflow builds installable wheels for each OS. ArcGIS and QGIS were too
            heavy to package and ship.
          - >-
            In field trials with the San Diego Zoo Wildlife Alliance, a tracking session
            that took about 4 hours on foot became a single 20-minute flight, with
            location estimates around 1 m in good conditions. It tracked small reptiles
            and mammals across rough terrain in several trials.
          - >-
            For the next step, towers with time difference of arrival (TDOA), my part
            was scoping: the tower comms package, the WES 207 and CSE 145/237D
            course-project proposals, and the parts list for a TDOA dataset. The tower
            hardware and the solar work were other students'.
