# The CV. This file IS the master CV — there is no separate selection spec.
#
# Every entry below appears on the generated CV (_cv.tex -> /cv.pdf), in the
# order it appears here, with all non-alt bullets. Nothing is curated in or
# out downstream, so an entry that does not belong on the CV does not belong
# in this file. Tailored variants (_resumes/variants/*.yaml) select subsets
# of this content; the website timeline (src/_data/resume.js) selects via
# _resumes/data/website.yaml.
#
# Text is canonical prose:
#   **bold**  *italic*  [text](url)   plus Unicode – — ~ × λ “ ” and literal
#   % & # $ _ characters; the generator escapes per target (LaTeX / HTML).
# Raw backslashes are a validation error — use a per-bullet tex:/html:
# override for the rare construct the markup can't express.
#
# Bullets marked `alt: true` are shared condensed rewordings: excluded from
# `bullets: all` (so off the CV), selectable by id from variant specs and the
# website. Dates are quoted "YYYY-MM" or the word `present`. Bullets always
# use `>-`.
#
# WRITING A BULLET: name the system, then the number, at its original grain —
# "172 failed attempts across 2,200+ work items produced only 27 dead-letters",
# not "high reliability". Everyone can generate a polished, tailored-looking
# resume now, so polish proves nothing and surveyed hiring managers reject on
# genericness rather than on AI use; a number that specific is the one claim a
# stranger cannot fabricate. Say the mechanism only when a reader outside the
# project would follow it — "a per-run allowlist so each job loads only the
# tools it needs" lands, "cut six never-invoked servers' schemas from every
# prompt" does not. Nothing here is invented, ever: if it is not true and
# checkable in an interview, it does not go in this file.
#
# ONLY HIS OWN WORK. Group projects and lab efforts are described on the
# website as the story of the whole team; here, a bullet describes what Tyler
# did, and it must survive a look at the commit history. That is why the
# Engineers for Exploration entry no longer carries the SDR/DSP stack or the
# tower power analysis (other students' work he led, not code he wrote) and
# why the music-generation entry covers only its MIDI-repair half (2026-09-04).

# The CV carries no `headline` under the name, no `summary` section, and no
# Interests row. It opens on Skills and lets the entries speak for themselves.
#
# This is enforced, not merely unset: _resumes/_lib/load.js FAILS the build if
# this file grows a `headline` or `summary` key or an `interests` section, so an
# unattended regeneration can never quietly switch one back on. Putting one back
# is a deliberate edit to that guard. Tailored resumes are unaffected and set
# their own in _resumes/variants/*.yaml, and the interests bank and picks stay
# live in _resumes/data/interests.yaml for the website hero.

# CV section order and headings. Each section renders a whole collection from
# this file — there is no per-entry list, because every entry is on the CV.
# Tailored variants repeat this order with their own trimmed entry lists.
sections:
  - title: Skills
    kind: skills
  - title: Professional Experience
    kind: role
  - title: Projects
    kind: project
  - title: Publications
