            AGMM and MMB had no usable public code, so I reimplemented them from their
            papers. AGMM is C++ with OpenCV, its per-pixel loop parallelized with
            OpenMP. MMB is MATLAB, with one configurable entry point, debug output for
            each stage, an option to run its low-rank matrix completion across MATLAB
            workers, and the pipeline filter the paper describes but doesn't ship.
