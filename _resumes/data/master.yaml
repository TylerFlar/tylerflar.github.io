        notes:
          - >-
            The project supports the Uaso Ngiro Baboon Project in measuring how baboons
            move and interact in the wild. The tracker, Spot, was a master's student's
            thesis work that I helped with. My part was coordinating data collection
            and labeling, reimplementing the AGMM and MMB baselines, and the
            hyperparameter search that ran the evaluation.
          - >-
            The labeled frames became the Laikipia Baboon Aerial Dataset (LBAD). The
            BBC footage was shot for a documentary, The Secret Lives of Animals on Apple
            TV+, and about a second of it made episode 10.
