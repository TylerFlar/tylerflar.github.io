# The record. Every entry below feeds the website, LinkedIn and each
# application's resume. The public CV (_cv.tex -> /cv.pdf) is the two pages
# cv.yaml picks from it: to take something off the CV, leave it out of cv.yaml,
# and to take it off everywhere, delete it here. website.yaml picks what the
# homepage timeline shows.
#
# Text is canonical prose: **bold**, *italic*, [text](url), plus literal
# % & # $ _ and a few Unicode characters (en dash, × λ “ ”); the generator
# escapes them per target. A raw backslash is an error.
#
# Bullets use `>-`. `alt: true` marks a website-only bullet (the homepage
# summaries); it never prints on the CV. Dates are quoted "YYYY-MM" or
# `present`, and an end still ahead is "expected YYYY-MM".
#
# ORDER: every list runs newest first (still running, then the latest end,
# then the latest start), and the build fails on a list out of order.
#
# BUDGET: an entry earns bullets from its share of the career, which runs from
# the earliest start here (the BS, 2021-09): its full-time months (the months
# it ran times a typical week over 40 hours: industry 40, research and projects
# 20, teaching and volunteering 10, or the entry's own `hoursPerWeek`) over the
# career's months. 1/64 of the career earns 2 bullets, 3/64 earn 3, 7/64 earn 4
# and so on, with no cap. Once an entry ends, it loses a bullet for each whole
# quarter of the career since, and at 0 it comes off. A role and its
# subprojects share one budget. Going over, or reaching 0, fails npm run cv and
# the tests, and the message says what to cut. See _resumes/_lib/budget.js.
#
# SKILLS: each entry names the skills it shows in its own `skills:` list, and
# every skill needs an entry behind it, so a skill leaves when the last entry
# that used it does. A degree lists the skills only its classes back. See
# _resumes/_lib/skills.js.
#
# VOICE: one plain sentence per bullet, at most 220 characters, with its
# numbers at their original grain. The voice lint (_resumes/_lib/voice.js)
# checks it.
#
# OWN WORK: a bullet says what I did. Group projects tell the whole team's
# story on their pages, but a CV bullet has to hold up against the commits.

# The CV carries no `headline` under the name, no `summary` section, and no
# interests row. It opens on Education, then Skills. A one-line
# `researchInterests` is the one top line the loader allows, for an academic
# CV; this one leads with industry, so it has none.
#
# This is enforced, not merely unset: _resumes/_lib/load.js FAILS the build if
# this file grows a `headline` or `summary` key or an `interests` section, and
# _resumes/_lib/cv.js fails cv.yaml the same way. Putting one back is a
# deliberate edit to those guards. An application's resume is unaffected and
# sets its own in its resume.yaml, and the interests row lives in
# _resumes/data/interests.yaml for the homepage.

# Section order and headings for the record. cv.yaml and each application's
# resume (npm run apply) pick and reorder from these by title, and a bare title
# prints the whole section as it stands here.
#
# A role section prints the roles on its tracks. Industry, research and
# teaching share Experience, newest first, the way LinkedIn lists them, and are
# held to the same rules. A role's own track still sets its typical week for
# the budget.
sections:
  - title: Education
    kind: education
  - title: Skills
    kind: skills
  - title: Experience
    kind: role
    tracks: [industry, research, teaching]
  - title: Projects
    kind: project
  - title: Publications
    kind: publication
  - title: Honors & Awards
    kind: award
  - title: Leadership
    kind: volunteer

