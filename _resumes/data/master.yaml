projects:
  # Kenneth Adams's pull requests (#2's 10 fixes and the 270/275 pass rate, #5's
  # bugged-seed fix, #8's 60-fix sweep) are credited on the page, not claimed
  # here. Mine: the harness and its 275 scenarios, the Lua oracles, and the
  # offline tests, all written before any outside pull request.
  - id: jackdaw
    name: Jackdaw
    tagline: Balatro simulator for reinforcement learning research
    start: "2026-03"
    end: present
    bullets:
      - id: engine
        text: >-
          Wrote a Python copy of the Balatro engine (all 150 jokers, bit-exact RNG) that
          runs as a Gymnasium environment for reinforcement learning.
      - id: interface
        text: >-
          Designed the RL interface: entity observations for cards and jokers, 21
          factored action types with legality masks, and a Discrete(500) wrapper for
          MaskablePPO.
      - id: validation
        text: >-
          Built a harness that replays the same moves in the real game and diffs the
          state across 275 scenarios, and merged 13 pull requests from 5 outside
          contributors.

  - id: tasque
    name: Tasque
    tagline: Vibe-coded agent platform, an experiment in what AI coding agents can and can't build
    start: "2026-03"
    end: "2026-10"
    bullets:
      - id: experiment
        text: >-
          Vibe-coded a self-hosted agent platform with Claude Code and Codex to see how
          far coding agents could carry a real system, then ran 5,400+ jobs on it from
          May to October 2026.
      - id: tools
        text: >-
          Tried LangGraph, a Neo4j knowledge graph, a dozen MCP servers and
          OpenTelemetry tracing with Grafana along the way, and found a plain job queue
          beat autonomous agents.
      - id: audit
        text: >-
          Audited 400+ runs and found 6 of the 12 MCP servers loaded into every prompt
          were never called, then had each job declare the servers it needed.

  # Four-person class project, split in half. The image-to-music half (BLIP
  # captions, the prompt bridge, MusicGen and the LoRA test) was the other
  # pair's, so the page credits it. A partner and I took MIDI repair, and the
  # bullets stay on what my commits show: the corpus, the corruption step and
  # the model.
  - id: music-generation
    name: Conditioned Music Generation
    tagline: Repairing missing bars of piano MIDI with a Transformer (four-person CSE 253 project)
    start: "2026-05"
    end: "2026-06"
    bullets:
      - id: corpus
        text: >-
          Built a piano MIDI corpus from MAESTRO, POP909 and GiantMIDI-Piano, and a
          corruption step that deletes 2–6 whole bars, so a repair has to be a phrase
          and not copied texture.
      - id: model
        text: >-
          Trained a bidirectional Transformer in PyTorch to fill the missing bars and
          scored repairs on how well they fit the music around them, beating a baseline
          that repeats the bars before the gap.

  # Three-person class project. My commits are the initial system, the Street
  # View loop and the verifier gate. Teammates built the perception pre-pass,
  # the coverage policy, the Geographer-side clue filter and the panorama
  # unwarping, so the evidence firewall isn't claimed here.
  - id: active-perception
    name: Active Perception for Geolocation
    tagline: Agentic street-view geolocation (three-person CSE 252D project)
    start: "2026-04"
    end: "2026-06"
    bullets:
      - id: loop
        text: >-
          Built the core of a vision-language agent that plays GeoGuessr by panning,
          zooming and moving through live Google Street View, including its Playwright
          and MCP browser tools, scene memory and commit rule.
      - id: results
        text: >-
          Raised country accuracy from 57% to 86% and cut median error from 382 km to
          1.6 km against a one-shot baseline, then showed an overly cautious commit rule
          cost more points than perception did.

  # The page tells all three CSE 260 projects. Each was a pair project, with a
  # different partner every time.
  - id: parallel-computing
    name: Parallel Computing
    tagline: Matrix multiply on CPU and GPU, and an MPI wave simulation (CSE 260 pair projects)
    start: "2025-09"
    end: "2025-12"
    bullets:
      - id: cpu-gemm
        text: >-
          Hand-tuned a double-precision matrix multiply for one AWS Graviton3 core,
          with packed panels and an Arm SVE microkernel, edging out OpenBLAS at the
          tested sizes.
      - id: gpu-mpi
        text: >-
          Wrote a tiled CUDA matrix multiply that reached about 4.8 TFLOP/s on an
          NVIDIA T4, and an MPI wave simulation that scaled to hundreds of cores on
          SDSC Expanse.

  # The paper this fed is under Publications; the bullets stay on the part of
  # the system I built.
  - id: followme
    name: FollowMe Robot
    tagline: Bluetooth direction finding for Boston Dynamics Spot
    start: "2025-04"
    end: "2025-06"
    bullets:
      - id: aoa
        text: >-
          Built the Bluetooth direction-finding module for a human-following Boston
          Dynamics Spot, estimating where a person's tag is in 3D from BLE angle of
          arrival and signal strength.
      - id: pipeline
        text: >-
          Wrote the C host program and the Python ROS node, with MQTT between them,
          and put smoothing and outlier rejection in Python to calm multipath noise.

