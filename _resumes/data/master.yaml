projects:
  # Lines and tests measured 2026-10-02; jobs, attempts and workflow runs
  # re-measured 2026-10-06 from the live database (it starts 2026-05-15). The
  # mcp bullet counts the public core's tools, the grain of the old 64; the
  # private extension's bring the total to 135.
  #
  # 2026-10-06: `uses` leads, so the entry says what Tasque does before how it
  # works (the user's word). It names public uses only. Money, health, social
  # and the job-application pipeline run through Tasque too and stay out of it
  # until the user says otherwise.
  # 2026-10-13: Tasque reads as a platform for anyone's recurring or on-demand
  # work, with the user's own assistant as its first use (the user's word).
  # Discord is one way in, beside a schedule and the command line.
  - id: tasque
    name: Tasque
    tagline: Self-hosted AI agent platform in everyday use
    start: "2026-03"
    end: present
    bullets:
      - id: uses
        text: >-
          Turned any task written in plain Markdown into a dependable AI agent
          job that runs on a schedule, from the command line, or from a Discord
          message; the agents I run on it keep this CV, my website, LinkedIn,
          and GitHub current from one YAML file, watch Canvas for deadlines,
          sweep my inboxes, and brief me each morning—3,300+ jobs since May 2026.
      - id: reliability
        text: >-
          Designed an out-of-band result protocol—each attempt mints a token the
          agent must return through Tasque's own MCP server—so a job whose agent
          crashes, loses its connection, or hits a usage limit is retried instead
          of marked done or failed; across 3,300+ jobs, 198 failed attempts
          produced only 28 dead-letters.

  # 2026-10-02: the validation bullet no longer cites the 10 fixes and the
  # 270/275 pass rate: they were Kenneth Adams's PR #2 (the bugged-seed fix is
  # PR #5, the 60-fix sweep PR #8). Tyler's part is the harness and its 275
  # scenarios, the Lua oracles, and the 1,480 offline tests as of 2026-03-22,
  # before any outside pull request.
  - id: jackdaw
    name: Jackdaw
    tagline: Balatro simulator for reinforcement learning research
    start: "2026-03"
    end: present
    bullets:
      - id: engine
        text: >-
          Built a complete Python reimplementation of the Balatro game engine (~30
          modules, all 150 joker effects, bit-exact 3-layer PRNG matching LuaJIT 2.1)
          exposed as a Gymnasium-compatible RL environment.
      - id: validation
        text: >-
          Built a differential-testing harness that replays identical action sequences
          against the retail game over a socket and diffs the resulting state across
          275 live scenarios, plus Lua oracles that cross-validate the RNG, hand
          evaluation, and scoring, alongside 1,480 offline tests.

  # Three-person class project; his commits are the initial system, the Google
  # Street View loop, and the verifier gate. Teammates built the perception
  # pre-pass, the coverage policy, the Geographer-side clue filter, and the
  # panorama unwarping, so the evidence firewall is not claimed as his.
  - id: active-perception
    name: Active Perception for Geolocation
    tagline: Agentic street-view geolocation (three-person CSE 252D project)
    start: "2026-04"
    end: "2026-06"
    bullets:
      - id: loop
        text: >-
          Built the core of an agentic vision–language system that plays GeoGuessr by
          *actively* panning, zooming, and moving a live Google Street View window: the
          browser harness and its Model Context Protocol tools, the Navigator,
          Geographer, and Verifier loop, the 2.5D topological scene memory, and the
          deterministic confidence-floored commit gate.
      - id: results
        text: >-
          Against a one-shot baseline the loop raised country accuracy from 57% to 86%
          and cut median error from 382 km to 1.6 km; my analysis of the gap between
          best-attempt and committed scores showed the commit gate withholding correct
          guesses, not perception, was the ceiling.

  # The paper this fed is under Publications; the bullets stay on the part of
  # the system he built.
  - id: followme
    name: FollowMe Robot
    tagline: Bluetooth direction-finding for Boston Dynamics Spot
    start: "2025-04"
    end: "2025-06"
    bullets:
      - id: aoa
        text: >-
          Built a Bluetooth direction-finding “follow-me” stack for Boston Dynamics
          Spot using BLE angle-of-arrival plus RSSI-based ranging to estimate 3D tag
          position in real time.
      - id: pipeline
        text: >-
          Implemented the host pipeline in C (NCP/BGAPI ingest to AoA solve to
          spherical-to-Cartesian) and published pose + angle telemetry over MQTT.

