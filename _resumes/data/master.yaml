          when a release fails its smoke test, with CloudWatch alarms on Lambda errors and
          CloudFront 5xx emailed through SNS.
      - id: ops-alarms
        rewords: ops
        text: >-
          Deployed the Arena from GitHub Actions through least-privilege OIDC roles with
          no stored AWS keys, with CloudWatch alarms on Lambda errors and CloudFront 5xx
          emailed through SNS.
    notes:
      - >-
        Jackdaw is an open-source Balatro simulator for reinforcement learning. I wrote
        it in Python in March 2026 and ported the engine to Rust in October 2026,
        keeping the Python interface through PyO3 bindings.
      - >-
        The repo's demo trains MaskablePPO for 30 million steps, 40 minutes on a
        desktop CPU. On the same 1,000 runs, on seeds training never saw, it beat 4.52
        blinds a run, the hand-written heuristic 5.38 and random legal moves 0.001,
        each PPO and heuristic figure with a standard error of 0.13, and no agent has
        won a run.
      - >-
        With the default reward, a loss penalty of 0.2 and a discount of 0.995 made
        stalling a lost run free, and an early policy learned to sort and swap cards
        until the 2,000-step cap. The demo drops the loss penalty and pays more for
        progress.
      - >-
        48% of an earlier demo's greedy episodes ran into the step cap, looping on
        free moves like swapping two cards, so the environments now allow at most 10
        free moves in a row, and no episode reaches the cap.
      - >-
        Jackdaw Arena went live in October 2026.
      - >-
        The Arena runs serverless on AWS: CloudFront serves the React site from S3 and
        sends the API to a FastAPI app on Lambda, with the data in Aurora DSQL, and
        Terraform sets all of it up.
      - >-
        The database keeps each episode's seed and the index of every move. Each
        Lambda instance keeps recent games in memory, and one that hasn't seen an
        episode rebuilds it by replaying its moves, so any instance can serve any step
        and a retried request gets back the response it lost.
      - >-
        Every green push to main deploys: migrate the database, publish a new Lambda
        version and health-check it, move traffic to it, upload the site and
        smoke-test it, and move traffic back if anything fails.
      - >-
        Each agent gets 500 episodes on a track, each on a fresh 16-character seed
        from a cryptographic random generator, kept secret until the episode ends.
        When an episode ends, the server replays it and checks it lands on the same
        state hash, then publishes the seed and the moves.
      - >-
        The Arena's agent API is versioned under /api/v1, and ArenaEnv, in the
        jackdaw-arena Python package, is its client.
      - >-
        The Arena's site is React in TypeScript. Its cards and charts read as labeled
        images, its replay controls have ARIA labels, and live regions announce the
        replay's step and the board's banners.

