          instead of guessing from a single frame.
      - id: results
        text: >-
          Raised country accuracy from 57% to 86% with an evidence firewall that keeps
          map-rendered text out of the reasoner and a confidence-floored commit gate;
          analyzed the calibration gap against a one-shot baseline.
