# The record. Every entry below feeds the website, LinkedIn and each
# application's resume. The public CV (_cv.tex -> /cv.pdf) is the two pages
# cv.yaml picks from it: to take something off the CV, leave it out of cv.yaml,
# and to take it off everywhere, delete it here. The homepage shows what the CV
# does, in the order website.yaml gives.
#
# Text is canonical prose: **bold**, *italic*, [text](url), plus literal
# % & # $ _ and a few Unicode characters (en dash, × λ “ ”); the generator
# escapes them per target. A raw backslash is an error.
#
# Bullets use `>-`. `alt: true` marks a website-only bullet (the homepage
# summaries); it never prints on the CV. `rewords: id` marks another wording of
# the bullet with that id, and a document prints one or the other, never both,
# while "all" prints the original. A role's own bullet can reword one of its
# subprojects' as `rewords: sub.id`. Dates are quoted "YYYY-MM" or `present`,
# and an end still ahead is "expected YYYY-MM". A role's `workType` (Remote,
# Hybrid or On-site) prints after its location on the CV, the homepage and
# LinkedIn, and only once when the location says it already. A role's
# `oneBullet: [ids]` names the bullets, as "id" or "sub.id", that can stand for
# it alone: a document that prints just one of its bullets prints one of these.
#
# ORDER: every list runs newest first (still running, then the latest end,
# then the latest start), and the build fails on a list out of order.
#
# BUDGET: this file keeps every bullet worth having, as many as an entry has,
# so nothing waits in a comment for a resume that wants it. The budget limits
# how many of an entry's bullets the CV and each resume print. An entry earns
# bullets from its share of the career, which runs from the earliest start
# here (the BS, 2021-09): the months it ran times the typical week of its kind
# of work. Once it ends, it loses a bullet for each whole quarter of the
# career since, and at 0 no document prints it. It stays here, and its page
# comes off the site: a project in budget has a page there (npm run cv fails
# one that doesn't), and a project out of budget has none. A role and its
# subprojects share one budget. A paper has a budget of its own, apart from the
# project it came out of: it's weighed by my place among its authors, a year's
# full-time work as first author and a year over the place after that, from
# the month it came out. A CV or resume that prints more fails npm run cv, npm
# run apply and the tests, and the message says what to cut. The README has
# the numbers, and _resumes/_lib/budget.js is the rule.
# A new resume starts from the CV's picks and fills the rest of each budget in
# this file's order, so an entry's strongest bullets go first.
#
# SKILLS: each entry names the skills it shows in its own `skills:` list, and
# every skill needs an entry behind it, so a skill leaves when the last entry
# that used it does, and no document prints it once every entry behind it is
# out of budget. A degree lists the skills only its classes back. A paper lists
# the skills of the work it reports, and has a budget of its own, so they print
# for as long as the paper does. See _resumes/_lib/skills.js.
#
# NOTES: an entry, a subproject or a paper may keep `notes:`, a list of
# sentences with facts worth keeping that aren't bullets, like what its project
# page said before the page came off the site. No document prints a note, and
# none moves the skill rank. A resume's rewording can draw on one, and its
# numbers count as the record's.
#
# VOICE: one plain sentence per bullet, at most 220 characters, with its
# numbers at their original grain. The voice lint (_resumes/_lib/voice.js)
# checks it.
#
# OWN WORK: a bullet says what I did. Group projects tell the whole team's
# story on their pages, but a CV bullet has to hold up against the commits.

# The CV carries no `headline` under the name, no `summary` section, and no
# interests row. It opens on Education, then Skills. A one-line
# `researchInterests` is the one top line the loader allows, for an academic
# CV. This one has none.
#
# This is enforced, not merely unset: _resumes/_lib/load.js FAILS the build if
# this file grows a `headline` or `summary` key or an `interests` section, and
# _resumes/_lib/cv.js fails cv.yaml the same way. Putting one back is a
# deliberate edit to those guards. An application's resume is unaffected and
# sets its own in its resume.yaml, and the interests row lives in
# _resumes/data/interests.yaml for the homepage.

# Section order and headings for the record. cv.yaml and each application's
# resume (npm run apply) pick and reorder from these by title, and a bare title
# prints the whole section as it stands here.
#
# A role section prints the roles on its tracks. Industry, research, teaching
# and self-employed work share Experience, newest first, and are held to the
# same rules. A role's own track still sets its typical week for the budget.
sections:
  - title: Education
    kind: education
  - title: Skills
    kind: skills
  - title: Experience
    kind: role
    tracks: [industry, research, teaching, self-employed]
  - title: Projects
    kind: project
  - title: Publications
    kind: publication
  - title: Honors & Awards
    kind: award
  - title: Leadership
    kind: volunteer

