    tagline: Agentic street-view geolocation (three-person CSE 252D project)
    start: "2026-04"
    end: "2026-06"
    skills: [Python, Playwright, MCP servers, React, Node.js]
    bullets:
      - id: loop
        text: >-
          Built the core of a vision-language agent that plays GeoGuessr by panning,
          zooming and moving through live Google Street View, including its Playwright
          and MCP browser tools, scene memory and commit rule.
      - id: loop-roles
        rewords: loop
        text: >-
          Built the core of a GeoGuessr agent in live Street View, its navigator,
          geographer and verifier loop and a confidence rule for committing, and raised
          country accuracy from 57% to 86% over a one-shot baseline.
      - id: results
        text: >-
          Raised country accuracy from 57% to 86% and cut median error from 382 km to
          1.6 km against a one-shot baseline, then showed an overly cautious commit rule
          cost more points than perception did.
      - id: results-scoring
        rewords: results
        text: >-
          Built its core loop and harness, raised country accuracy from 57% to 86% over a
          one-shot baseline on seven locations, and scored best and committed guesses
          apart to show its commit rule cost more points than perception.
    notes:
      - >-
        The test set was seven residential or suburban locations in seven countries on
        six continents. The loop and the one-shot baseline used the same model, and
        the loop averaged 6.1 turns, about 18 model calls an episode against 1.
      - >-
        Each guess was scored two ways: best-attempt, the best guess whether or not
        the rule committed it, and committed, which scores a withheld guess as zero.
      - >-
        The rule committed 3 of the 7 guesses. On best-attempt scores the loop
        averaged 3974 points to the baseline's 3899, and on committed scores 2142.
        Committed guesses averaged 0.8 km of error and withheld ones 1,136 km.
