          alarms on Lambda errors and CloudFront 5xx emailed through SNS, and an
          idle-episode janitor on EventBridge Scheduler.
      - id: ops-security
        rewords: ops
        text: >-
          Deployed the Arena from GitHub Actions through least-privilege OIDC roles with
          no stored AWS keys, pinned every action to a commit, and protected main to take
          merges only from dev and hotfix branches.
      - id: ops-rollback
        rewords: ops
        text: >-
