# The CV. This file IS the CV: every entry below prints on it (_cv.tex ->
# /cv.pdf), in file order, with all of its non-alt bullets. To take something
# off the CV, delete it. The website reads its facts from here too, and
# website.yaml picks what the homepage timeline shows.
#
# Text is canonical prose: **bold**, *italic*, [text](url), plus literal
# % & # $ _ and a few Unicode characters (en dash, × λ “ ”); the generator
# escapes them per target. A raw backslash is an error.
#
# Bullets use `>-`. `alt: true` marks a website-only bullet (the homepage
# summaries); it never prints on the CV. Dates are quoted "YYYY-MM" or
# `present`, and an end still ahead is "expected YYYY-MM".
#
# ORDER: every list runs newest first (still running, then the latest end,
# then the latest start), and the build fails on a list out of order.
#
# BUDGET: `tier` sets how many CV bullets an entry prints: flagship 3,
# standard 2 (the default), minor 1 (the default for teaching and
# volunteering). A role with subprojects shares 4. See _resumes/_lib/budget.js.
#
# VOICE: one plain sentence per bullet, at most 220 characters, with its
# numbers at their original grain. The voice lint (_resumes/_lib/voice.js)
# checks it.
#
# OWN WORK: a bullet says what I did. Group projects tell the whole team's
# story on their pages, but a CV bullet has to hold up against the commits.

# The CV carries no `headline` under the name, no `summary` section, and no
# interests row. It opens on a one-line Research Interests (`researchInterests`
# below), which the loader keeps a line of topics, then Education.
#
# This is enforced, not merely unset: _resumes/_lib/load.js FAILS the build if
# this file grows a `headline` or `summary` key or an `interests` section.
# Putting one back is a deliberate edit to that guard. Tailored resumes are
# unaffected and set their own in _resumes/resumes/<name>.yaml, and the
# interests row lives in _resumes/data/interests.yaml for the homepage.

# CV section order and headings. Each section renders a whole collection from
# this file; there is no per-entry list, because every entry is on the CV.
# A tailored resume (npm run resume) picks and reorders from these.
sections:
  - title: Research Interests
    kind: research-interests
  - title: Education
    kind: education
  - title: Research Experience
    kind: role
    track: research
  - title: Publications
    kind: publication
  - title: Projects
    kind: project
  - title: Industry Experience
    kind: role
    track: industry
    pageBreak: true
  - title: Teaching
    kind: role
    track: teaching
  - title: Leadership & Volunteering
    kind: volunteer
  - title: Skills
    kind: skills

# One line of topics under the CV heading; the homepage shows it too. At most
# 110 characters, no first person, no closing period.
researchInterests: >-
  Autonomous systems: perception, navigation, simulation and field testing

