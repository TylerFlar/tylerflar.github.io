          Gave its jobs a memory of facts, summaries and standing rules, recalled by
          keyword match, recency and importance, and they wrote 9,044 memories, 3,794
          later replaced by newer versions.
      - id: audit
        text: >-
          Audited 400+ runs and found 6 of the 12 MCP servers loaded into every prompt
          were never called, then had each job declare the servers it needed.
      - id: oversight
        text: >-
          Made every job report its result through Tasque's own MCP server before it
          counted, retried any job that never reported, and let workflows wait for my
          approval before a step that couldn't be undone.
      - id: model-audit
        text: >-
          Audited the logs of 389 runs and found all of them on the largest model, 146
          after asking for a smaller one, because nothing passed the request along.
    notes:
      - >-
        Tasque was a self-hosted platform that ran AI agents as jobs from schedules,
        workflows and Discord messages.
      - >-
        OpenTelemetry tracing went in on 2026-09-23, and Tasque was archived on October
        19, so it traced the last four weeks of jobs, not all 5,454.
      - >-
        "Done" didn't mean done: agents would exit cleanly having done nothing, so
        every job had to report its result back through Tasque's own MCP server before
        it counted, and a job that never reported was retried.
      - >-
        Tasque's database, as it stood when I archived it, holds the 5,454 jobs it ran
        from May 15 to October 19, 2026: 5,366 succeeded, 57 were canceled and 31 were
        dead-lettered after they kept failing.
      - >-
        3,919 of the jobs went to a model as a Claude Code or Codex session, and 3,831
        of those succeeded. The other 1,535 were plain Python functions, and all of
        them succeeded.
      - >-
        Counting retries, the model jobs took 4,070 sessions: 3,722 on Claude Code and
        348 on Codex.
      - >-
        2,368 jobs came from workflows, 1,727 from schedules, 1,029 from replies in a
        result's Discord thread and 13 from plain messages in the Discord intake
        channel.
      - >-
        The queue leased each job to a worker, retried one that failed or whose lease
        ran out, and dead-lettered one that kept failing.
      - >-
        Work with several steps ran as a workflow that could fan out over a list and
        wait for my approval before doing anything that couldn't be undone.
      - >-
        An audit of the model each run used found all 389 runs in its window on the
        largest model, including 146 that asked for a smaller one, because nothing
        passed the request along. Nothing failed, so it only showed up in the run logs.

