  - id: followme
    name: FollowMe Robot
    tagline: Bluetooth direction finding for Boston Dynamics Spot (CSE 237D team project)
    start: "2025-04"
    end: "2025-06"
    skills: [C/C++, Python, ROS, MQTT, BLE angle-of-arrival]
    bullets:
      - id: aoa
        text: >-
          Built the Bluetooth direction-finding module for a human-following Boston
          Dynamics Spot, estimating where a person's tag is in 3D from BLE angle of
          arrival and signal strength.
      - id: pipeline
        text: >-
          Wrote the C host program and the Python ROS node, with MQTT between them, and
          put smoothing and outlier rejection in Python to calm multipath noise.
    notes:
      - >-
        A project for NIWC (Naval Information Warfare Center) to turn a Boston
        Dynamics Spot into a robot that follows a person and takes commands from a
        smartwatch.
      - >-
        It had three parts: smartwatch control, a camera-based follower, and
        Bluetooth direction finding. I built the Bluetooth part.
      - >-
        The receiver on the robot was a Silicon Labs BG22 dual-polarized antenna
        array kit, a 4×4 array. The beacon was an EFR32BG22 Thunderboard during
        development, with a Samsung Galaxy Watch Ultra as the long-term goal.
      - >-
        The stack was Silicon Labs' direction-finding SDK, C on the host, MQTT in
        the middle, Python for smoothing and cleanup, and ROS 1 Noetic on Ubuntu
        20.04.
      - >-
        The beacon sends Bluetooth Low Energy packets with a Constant Tone
        Extension. The phase differences between antennas give the angle of arrival,
        and signal strength (RSSI) through a log-distance path-loss model gives a
        rough distance.
      - >-
        I smoothed the angle with an exponential moving average (0.65 during
        bring-up), threw out sudden RSSI jumps above a threshold and averaged across
        the antennas.
      - >-
        It worked end to end, at a useful update rate, and in open spaces the
        direction was often good enough to follow. Indoors, signals bouncing off
        walls made the estimate too noisy to be the main follower, so the final
        demos leaned on the camera follower, with Bluetooth as the backup.

  - id: music-genre
    name: Music Genre Prediction
    tagline: Genre from Spotify audio features, out of 19 (two-person CSE 158R project)
    start: "2024-11"
    end: "2024-12"
    skills: [Python, pandas, matplotlib, seaborn, scikit-learn, XGBoost, CatBoost, Jupyter]
    bullets:
      - id: models
        text: >-
          Tuned random forest, XGBoost and CatBoost models with grid search, reaching
          about 0.37 accuracy against a 0.06 baseline that guesses by class frequency.
      - id: data
        text: >-
          Built a genre classifier for 15,150 songs from their Spotify audio features,
          log-transforming skewed features and balancing 19 uneven genres with
          SMOTETomek.
    notes:
      - >-
        The second assignment in CSE 158R (Web Mining and Recommender Systems), Fall
        2024. My partner tried a logistic regression. The exploratory analysis, the
        baseline, the models and the write-up were mine.
      - >-
        The dataset is 15,150 classic hits from Kaggle across 19 genres. Removing
        279 duplicate artist and track pairs left 14,871 songs, split 80/20 with the
        genre mix kept the same on both sides, and scored on the 2,975 held out.
      - >-
        Energy and loudness were strongly correlated, so I dropped loudness, which
        left 12 features.
      - >-
        Test accuracy: baseline 0.064, QDA 0.252, k-nearest neighbors 0.253,
        logistic regression 0.268, tuned MLP 0.302, SVM 0.324, extra trees 0.349,
        XGBoost 0.351, tuned CatBoost 0.352, tuned random forest 0.373, and a
        soft-voting ensemble of random forest, XGBoost, extra trees and QDA 0.376.
      - >-
        I picked the ensemble by trying combinations against the test set, so its
        0.376 is a little optimistic. The tuned random forest's 0.373 is the fairer
        number.

