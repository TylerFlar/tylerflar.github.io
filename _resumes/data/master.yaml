  # Two-person class project. The image-to-music half (BLIP captioning, the
  # prompt bridge, MusicGen, the LoRA ablation) was his partner's; the website
  # tells the whole story, the CV carries the half in his commits.
  - id: music-generation
    name: Conditioned Music Generation
    tagline: MIDI repair with a beat/bar-aware Transformer (two-person CSE 253 project)
    start: "2026-05"
    end: "2026-06"
    bullets:
      - id: midi-corpus
        text: >-
          Owned the symbolic half of the project: built a piano-MIDI corpus from
          MAESTRO, POP909, and GiantMIDI-Piano with per-frame piano-roll features
          (note activity, onset, hold, velocity, beat and bar position) and a corruption
          scheme that deletes 2–6 whole bars, so a repair has to be a phrase rather than
          locally plausible texture.
      - id: midi-model
        text: >-
          Trained a bidirectional beat/bar-aware note-event Transformer (PyTorch) to fill
          the missing bars and evaluated it with a context-fit rubric (pitch-class
          cosine, density, register, boundary scores) plus a context-discrimination
          test—does a repair fit its own piece better than a random other one—beating a
          repeat-left-context baseline.

