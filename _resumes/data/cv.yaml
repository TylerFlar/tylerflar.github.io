          - ROS
          - Gymnasium
          - Visual SLAM (DROID-SLAM, VGGT-SLAM)
      - data: [SQLAlchemy, SQLite, PostgreSQL, Neo4j, SQL Server]
  - Experience:
      aquamesh: [scope]
      lycanworks: [studio, release, audience]
      arclab: [surgical-research, endonav.approach, endonav.fusion, endonav.simulator]
      resmed: [docs-toolchain, sql-mcp, usage-analysis]
      e4e: [lead-zoo, rtt.modernized, rtt.software]
