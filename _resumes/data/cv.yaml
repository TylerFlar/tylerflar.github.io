          - Python packaging (uv, maturin)
          - pytest
          - Markdown
          - Linux
          - Playwright
          - MQTT
          - LaTeX
          - OpenMP
      - agents: [MCP servers, Claude Code, "RAG (Qdrant, LangChain, FAISS)", LangGraph, Codex]
      - cloud:
