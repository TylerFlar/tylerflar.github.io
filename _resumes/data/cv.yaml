          - AWS (Lambda, IAM, EventBridge)
          - Terraform
          - Docker
          - OpenTelemetry
      - web: [React, Node.js, FastAPI, OAuth/OIDC, Eleventy, Vite/Vitest, Astro, Next.js]
      - ml:
