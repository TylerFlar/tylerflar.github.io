name: CI

# Every check there is, in one place. A pull request and a push to any branch
# but main run it by themselves. A push to main runs it as the first job of the
# deploy (deploy.yml), so nothing reaches the site that these would refuse.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:
  workflow_dispatch:
  # The bullet budget and the skill rank read today's month, so a check can
  # start failing with no commit at all. The first of each month finds out
  # before the next push does.
  schedule:
    - cron: "0 15 1 * *"

permissions:
  contents: read

# A newer push to a branch or pull request replaces its older run. A run on
# main (a deploy's checks, or the monthly one) gets a group of its own, so it
# always finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test the resume library
        run: npm run test:resumes

      - name: Check the committed CV matches master.yaml
        run: node _resumes/_generate.js --check

      - name: Check formatting
        run: npm run format:check

      - name: Build with Eleventy
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Internal links only: linkinator serves docs/ on localhost, so skip
      # every absolute URL except localhost (externals would flake).
      # cv.pdf is skipped because this job has no TeX; the cv job builds it.
      - name: Check internal links
        run: npx --yes linkinator@7.6.1 ./docs --recurse --skip "^https?://(?!localhost)" --skip "cv\.pdf"

  # The PDF that deploys, built the way the deploy builds it. npm run cv checks
  # the pages under the TeX on my machine, and TeX Live sets XCharter a hair
  # differently, so this is the only look at the real thing.
  cv:
    name: CV PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # A small TeX Live with only what the preamble loads, cached between
      # runs. apt's full install took 1 min 43 s of a 2-minute deploy, and a
      # branch run of both gave the same two pages with the same fill. If a
      # package is ever missing, the log names the .sty to add to the list.
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-basic xcharter fontaxes xkeyval xstring preprint titlesec
            enumitem

      - name: Build the CV and check its page count
        run: node _resumes/_check-pdf.js

      # The deploy publishes this same PDF, on the site and as a release.
      - name: Keep the CV for the deploy
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: _resumes/_cv.pdf
          retention-days: 1
