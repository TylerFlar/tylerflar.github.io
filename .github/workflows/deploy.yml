name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time, in push order, so neither the site nor the CV release can
# go back to an older version.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Every check a branch gets (ci.yml): the tests, the stale-CV check, the
  # formatting, the build, the audit, the links, and the CV's PDF built under
  # TeX Live with its page count checked. Nothing below runs unless they pass.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        run: npm run build

      # The PDF the checks built and counted the pages of, so TeX is installed
      # once a push and what was checked is what ships.
      - name: Get the CV the checks built
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: cv

      - name: Copy CV to site output
        run: cp cv/_cv.pdf docs/cv.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # From v4 on this action leaves dotfiles out unless asked, and
      # .well-known/discord is how Discord verifies the domain.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the CV PDF as a GitHub release when the CV has changed since the
  # commit the last release was built from, so a release that didn't go out is
  # made up on the next push. The PDF is the one the checks built, after the
  # tests passed: a release is public, so nothing ships that the checks would
  # refuse.
  release-cv:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the CV changed since its last release
        id: changed
        run: |
          prev=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("cv-"))][0] | .target_commitish // empty')
          if [ -z "$prev" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No CV release yet."
          elif git diff --quiet "$prev" HEAD -- _resumes/_cv.tex _resumes/_preamble.tex _resumes/_heading.tex; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The CV hasn't changed since the last release, built from $prev."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The CV has changed since the last release, built from $prev."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the CV the checks built
        if: steps.changed.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: release

      - name: Create release
        if: steps.changed.outputs.changed == 'true'
        run: |
          TAG="cv-$(date -u +%Y%m%d-%H%M%S)"
          cp release/_cv.pdf cv.pdf
          gh release create "$TAG" cv.pdf --target "$GITHUB_SHA" \
            --title "CV $(date -u +%Y-%m-%d)" \
            --notes "Automated CV release — [download](https://github.com/${{ github.repository }}/releases/latest/download/cv.pdf)"
          # Keep only the newest CV public: older releases carry wording since withdrawn.
          for old in $(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name'); do
            case "$old" in
              cv-*) [ "$old" = "$TAG" ] || gh release delete "$old" --cleanup-tag --yes ;;
            esac
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
